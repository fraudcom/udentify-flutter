group 'com.videocallflutter'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.8.22'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.videocallflutter'
    }

    compileSdkVersion 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        consumerProguardFiles("consumer-rules.pro")
        minSdkVersion 21
    }

    dependencies {
        implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
        
        // Local AAR files (compile only - not packaged in plugin AAR)
        compileOnly(fileTree("libs") { include("*.aar") })
        // In-call LiveKYC repeat: the registry that carries repeat credentials between plugins.
        implementation(project(":udentify_core_flutter"))
        // Since 26.3.0913 this package's AAR has supertypes in the commons AAR (e.g. CameraListener), and
        // udentify-core-flutter declares commons compileOnly, which does not propagate. Compile against it here.
        compileOnly(fileTree("../../udentify-core-flutter/android/libs") { include("commons-*.aar") })
        
        // Video Call dependencies
        implementation 'com.squareup.okhttp3:okhttp:4.12.0'
        implementation 'com.squareup.okhttp3:okhttp-tls:4.12.0'
        implementation 'com.otaliastudios:cameraview:2.7.2'
        implementation 'com.google.android.material:material:1.4.0'
        implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
        implementation 'androidx.activity:activity:1.7.2'
        implementation 'androidx.navigation:navigation-fragment:2.8.3'
        implementation 'com.google.code.gson:gson:2.8.7'
        implementation 'io.livekit:livekit-android:2.13.0'
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }

    aaptOptions {
        noCompress "tflite"
    }
}
